# Mita Lite installer defaults
#
# When the user chooses to install Mita Lite, the installer defaults to using
# the entire SELECTED target disk for Mita Lite. The installer still asks for
# the target disk when needed and keeps the final partition-write confirmation.
# Nothing is erased merely by booting the live ISO.

# Use ordinary guided partitioning on the selected target disk.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

# If the selected target disk contains old LVM or software RAID metadata,
# allow the installer to remove it as part of replacing the old system.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/purge_lvm_from_device boolean true

# Give the installed desktop user normal hardware/session groups plus sudo.
# This keeps root available if the installer user chooses a root password,
# while also allowing the desktop account to administer the system with sudo.
d-i passwd/user-default-groups string audio cdrom floppy video sudo dip plugdev users netdev

# Do NOT preseed partman/confirm or partman/confirm_nooverwrite.
# The user must still explicitly confirm writing the new partition table.

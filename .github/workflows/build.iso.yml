name: Build Mita Lite v0.3 candidate ISO
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build on Debian 13
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -w /src debian:trixie bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools python3 ca-certificates
              chmod +x build.sh auto/config
              python3 tools/validate.py
              ./build.sh
              ISO="$(find work -type f -name "*.iso" -print -quit)"
              test -n "$ISO"
              cp "$ISO" /src/out/mita-lite-0.3-candidate-amd64.iso
              (cd /src/out && sha256sum mita-lite-0.3-candidate-amd64.iso > SHA256SUMS)
            '
      - uses: actions/upload-artifact@v4
        with:
          name: mita-lite-0.3-candidate
          path: out/
          if-no-files-found: error
          retention-days: 7
